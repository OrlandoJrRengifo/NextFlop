_format_version: "3.0"

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
      exposed_headers:
        - Authorization
      credentials: true
      max_age: 3600

services:
  # AUTH SERVICE
  - name: auth-service
    url: http://auth-service:3000  # VERIFICADO: Internamente corre en 3000
    routes:
      - name: auth-routes
        paths:
          - /api/auth
        strip_path: true

  # SUBSCRIPTIONS SERVICE (PLANES)
  - name: subscriptions-plans-service
    url: http://subscriptions-service:3000 # VERIFICADO: Internamente corre en 3000
    routes:
      - name: plans-direct-route
        paths:
          - /plans
        strip_path: false

  # SUBSCRIPTIONS SERVICE (API)
  - name: subscriptions-api-service
    url: http://subscriptions-service:3000/subscriptions # VERIFICADO: Internamente corre en 3000
    routes:
      - name: subscriptions-api-routes
        paths:
          - /api/subscriptions
        strip_path: true

  # BILLING SERVICE
  - name: billing-service
    url: http://billing-service:3000 # VERIFICADO: Internamente corre en 3000
    routes:
      - name: billing-routes
        paths:
          - /api/billing
        strip_path: true

  # MEDIA SERVICE
  - name: media-service
    url: http://media-service:3000 # VERIFICADO: Internamente corre en 3000
    routes:
      - name: media-routes
        paths:
          - /api/media
        strip_path: true

  # ONBOARDING SERVICE (Usa Auth Service)
  - name: onboarding-service
    url: http://auth-service:3000/onboarding # VERIFICADO: Internamente corre en 3000
    routes:
      - name: onboarding-routes
        paths:
          - /api/onboarding
        strip_path: true