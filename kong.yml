_format_version: "3.0"

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
      exposed_headers:
        - Authorization
      credentials: true
      max_age: 3600

services:

  # AUTH SERVICE
  - name: auth-service
    url: http://auth-service:3000
    routes:
      - name: auth-routes
        paths:
          - /api/auth
        strip_path: false

  # SUBSCRIPTIONS SERVICE
  - name: subscriptions-service
    url: http://subscriptions-service:3000
    routes:
      - name: subscriptions-routes
        paths:
          - /api/subscriptions
        strip_path: false

  # BILLING SERVICE
  - name: billing-service
    url: http://billing-service:3000
    routes:
      - name: billing-routes
        paths:
          - /api/billing
        strip_path: false

  # MEDIA SERVICE
  - name: media-service
    url: http://media-service:3000
    routes:
      - name: media-routes
        paths:
          - /api/media
        strip_path: false

  # ⭐ ONBOARDING SERVICE
  - name: onboarding-service
    url: http://auth-service:3000   # si vive dentro del auth-service
    routes:
      - name: onboarding-routes
        paths:
          - /api/onboarding
        strip_path: false
